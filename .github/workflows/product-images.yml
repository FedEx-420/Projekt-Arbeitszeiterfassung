name: Refresh public manufacturer product images
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: public-product-images
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: pip install pypdf==6.10.0
      - name: Update verified public product references
        run: python scripts/update_product_images.py --limit 160
      - name: Update product-specific Germany evidence
        run: python scripts/update_german_products.py --limit 80
      - name: Save public index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-image-index.json catalog-image-index-state.json catalog-de-evidence.json catalog-de-evidence-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified public product image index'
            git push
          fi
